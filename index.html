<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tavli Elite Tournament</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            /* Background με εικόνα τάβλι /
            background: url('https://www.tovima.gr/wp-content/uploads/2018/10/24/tavli.jpg') no-repeat center center fixed;
            background-size: cover;
            color: white;
        }

        .overlay {
            background: rgba(0, 0, 0, 0.8); / Σκούρο φίλτρο για να διαβάζονται τα κείμενα */
            min-height: 100vh;
            padding: 20px;
        }

        .container { max-width: 600px; margin: auto; }

        .header {
            text-align: center;
            border: 3px solid #d4af37;
            padding: 15px;
            border-radius: 20px;
            background: rgba(44, 26, 18, 0.95);
            margin-bottom: 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        #live-clock { font-size: 1.1rem; color: #d4af37; margin-bottom: 5px; }
        #live-date { font-size: 1rem; opacity: 0.9; margin-bottom: 10px; }

        .card {
            background: rgba(30, 30, 30, 0.9);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            border-top: 4px solid #d4af37;
        }

        h2 { color: #d4af37; margin-top: 0; font-size: 1.1rem; text-transform: uppercase; }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            border: 1px solid #444;
            background: #222;
            color: white;
            box-sizing: border-box;
            font-size: 16px;
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-gold { background: #d4af37; color: black; }
        .btn-gold:disabled { background: #555; color: #888; cursor: not-allowed; }
        
        .player-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.05);
            padding: 10px;
            margin: 5px 0;
            border-radius: 8px;
            border: 1px solid rgba(212, 175, 55, 0.3);
        }

        .del-btn { background: #ff4444; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; }

        .timer-msg { color: #ff5252; font-weight: bold; text-align: center; margin: 10px 0; }
    </style>
</head>
<body>

<div class="overlay">
    <div class="container">
        
        <!-- Header με Ημερομηνία/Ώρα -->
        <div class="header">
            <div id="live-date">Πέμπτη, 14 Μαΐου 2026</div>
            <div id="live-clock">00:00:00</div>
            <h1 style="margin:0; letter-spacing: 2px;">TAVLI TOURNAMENT PRO</h1>
        </div>

        <!-- Ρυθμίσεις Χρόνου & Επάθλων -->
        <div class="card">
            <h2>🏆 ΡΥΘΜΙΣΕΙΣ & ΕΠΑΘΛΑ</h2>
            <label>Λήξη Συμμετοχών (Ημερομηνία & Ώρα):</label>
            <input type="datetime-local" id="deadline" onchange="checkDeadline()">
            
            <div style="margin-top:10px;">
                <input type="text" id="prz1" placeholder="🥇 1ο Έπαθλο (π.χ. 100€)">
                <input type="text" id="prz2" placeholder="🥈 2ο Έπαθλο (π.χ. 50€)">
                <input type="text" id="prz3" placeholder="🥉 3ο Έπαθλο (π.χ. Τάβλι Wood)">
            </div>
        </div>

        <!-- Δήλωση Συμμετοχής -->
        <div class="card">
            <h2>📝 ΕΓΓΡΑΦΗ ΠΑΙΚΤΗ</h2>
            <div id="status-msg" class="timer-msg"></div>
            <input type="text" id="newPlayer" placeholder="Όνομα παίκτη...">
            <button id="reg-btn" class="btn btn-gold" onclick="addPlayer()">ΥΠΟΒΟΛΗ ΣΥΜΜΕΤΟΧΗΣ</button>
        </div>

        <!-- Λίστα -->
        <div class="card">
            <h2>👥 ΣΥΜΜΕΤΕΧΟΝΤΕΣ (<span id="total">0</span>)</h2>
            <div id="list"></div>
            <button class="btn btn-gold" style="margin-top:20px; background:#2e7d32; color:white;" onclick="makeDraw()">🔥 ΚΛΗΡΩΣΗ ΖΕΥΓΑΡΙΩΝ</button>
            <div id="results"></div>
        </div>

    </div>
</div>

<script>
    let players = [];
    let isExpired = false;

    // Ζωντανό Ρολόι & Ημερομηνία
    function updateDateTime() {
        const τώρα = new Date();
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('live-date').innerText = τώρα.toLocaleDateString('el-GR', options);
        document.getElementById('live-clock').innerText = τώρα.toLocaleTimeString('el-GR');
        checkDeadline(); // Έλεγχος κάθε δευτερόλεπτο
    }
    setInterval(updateDateTime, 1000);

    function checkDeadline() {
        const deadlineVal = document.getElementById('deadline').value;
        if (!deadlineVal) return;

        const limit = new Date(deadlineVal);
        const now = new Date();

        if (now >= limit) {
            isExpired = true;
            document.getElementById('reg-btn').disabled = true;
            document.getElementById('status-msg').innerText = "⌛ ΟΙ ΣΥΜΜΕΤΟΧΕΣ ΕΚΛΕΙΣΑΝ!";
        } else {
            isExpired = false;
            document.getElementById('reg-btn').disabled = false;
            document.getElementById('status-msg').innerText = "Η εγγραφή είναι ανοιχτή";
        }
    }

    function addPlayer() {
        if(isExpired) return;
        const name = document.getElementById('newPlayer').value.trim();
        if(!name) return;
        
        players.push(name);
        document.getElementById('newPlayer').value = "";
        renderList();
    }

    function removePlayer(i) {
        if(confirm("Διαγραφή του παίκτη " + players[i] + ";")) {
            players.splice(i, 1);
            renderList();
        }
    }

    function renderList() {
        document.getElementById('total').innerText = players.length;
        const listDiv = document.getElementById('list');
        listDiv.innerHTML = players.map((p, i) => `
            <div class="player-item">
                <span>${i+1}. ${p}</span>
                <button class="del-btn" onclick="removePlayer(${i})">X</button>
            </div>
        `).join('');
    }

    function makeDraw() {
        if(players.length < 2) return alert("Βάλε τουλάχιστον 2 άτομα!");
        let shuf = [...players].sort(() => Math.random() - 0.5);
        let res = "<h3 style='color:#d4af37'>ΑΠΟΤΕΛΕΣΜΑΤΑ ΚΛΗΡΩΣΗΣ</h3>";
        for(let i=0; i<shuf.length; i+=2) {
            res += `<div class='player-item' style='justify-content:center; border:1px solid gold;'>
                ${shuf[i]} <b style='color:gold; margin:0 15px;'>VS</b> ${shuf[i+1] || '--- (BYE
