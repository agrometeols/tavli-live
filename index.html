<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tavli Master Tournament</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a0f0a;
            /* Χρήση απλού URL χωρίς περίεργα σύμβολα για να μην "σπάει" ο κώδικας */
            background-image: url("https://upload.wikimedia.org/wikipedia/commons/3/30/Backgammon_lg.jpg");
            background-repeat: no-repeat;
            background-position: center;
            background-attachment: fixed;
            background-size: cover;
            color: #ffffff;
        }

        .overlay {
            background: rgba(0, 0, 0, 0.85);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        .header-box {
            text-align: center;
            border: 3px solid #d4af37;
            padding: 20px;
            border-radius: 25px;
            background: rgba(30, 15, 10, 0.95);
            margin-bottom: 25px;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
        }

        #main-clock {
            font-size: 3.5rem;
            font-weight: 900;
            color: #d4af37;
            margin: 10px 0;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }

        .card {
            background: rgba(25, 25, 25, 0.95);
            padding: 25px;
            border-radius: 20px;
            margin-bottom: 20px;
            border-left: 6px solid #d4af37;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h2 {
            color: #d4af37;
            margin-top: 0;
            font-size: 1.3rem;
            text-transform: uppercase;
            border-bottom: 1px solid #444;
            padding-bottom: 10px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border-radius: 10px;
            border: 1px solid #444;
            background: #000;
            color: #fff;
            box-sizing: border-box;
            font-size: 1rem;
        }

        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 1rem;
            transition: 0.3s;
        }

        .btn-gold {
            background: linear-gradient(to bottom, #d4af37, #b8952e);
            color: #000;
        }

        .btn-gold:hover { background: #f1c40f; }

        .master-panel {
            display: none;
            background: rgba(212, 175, 55, 0.1);
            border: 2px dashed #d4af37;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .player-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            margin: 8px 0;
            border-radius: 12px;
        }

        .score-pill {
            background: #d4af37;
            color: #000;
            padding: 5px 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .admin-controls button {
            background: #27ae60;
            color: white;
            border: none;
            padding: 8px 12px;
            margin-left: 5px;
            border-radius: 6px;
            cursor: pointer;
        }

        .btn-delete { background: #e74c3c !important; }

        .prize-display {
            font-size: 1.6rem;
            font-weight: bold;
            margin: 10px 0;
        }
        
        .master-login-link {
            background: none;
            border: none;
            color: #666;
            font-size: 0.7rem;
            cursor: pointer;
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="overlay">
    <div class="container">
        
        <!-- ΕΠΙΚΕΦΑΛΙΔΑ -->
        <div class="header-box">
            <div id="live-date" style="font-size: 1rem;">Πέμπτη, 14 Μαΐου 2026</div>
            <div id="main-clock">00:00:00</div>
            <div style="letter-spacing: 3px; font-weight: bold; color: #aaa;">TAVLI CHAMPIONSHIP</div>
            <button class="master-login-link" onclick="login()">Master Access</button>
        </div>

        <!-- MASTER SETTINGS (ΜΟΝΟ ΜΕ ΚΩΔΙΚΟ) -->
        <div id="admin-area" class="master-panel">
            <h2>⚙️ ΡΥΘΜΙΣΕΙΣ MASTER</h2>
            <input type="text" id="m-p1" placeholder="Έπαθλο 1ου (π.χ. 200€)" oninput="sync()">
            <input type="text" id="m-p2" placeholder="Έπαθλο 2ου (π.χ. 100€)" oninput="sync()">
            <label>Λήξη Εγγραφών:</label>
            <input type="datetime-local" id="m-time">
        </div>

        <!-- ΕΠΑΘΛΑ -->
        <div class="card">
            <h2>🏆 ΕΠΑΘΛΑ</h2>
            <div class="prize-display">🥇 1ος: <span id="view-p1" style="color:#d4af37;">100€</span></div>
            <div class="prize-display">🥈 2ος: <span id="view-p2" style="color:#d4af37;">50€</span></div>
        </div>

        <!-- ΕΓΓΡΑΦΗ -->
        <div class="card">
            <h2>📝 ΔΗΛΩΣΗ ΣΥΜΜΕΤΟΧΗΣ</h2>
            <div id="status-msg" style="text-align:center; font-weight:bold; margin-bottom:10px;"></div>
            <input type="text" id="name-input" placeholder="Το όνομά σας...">
            <button id="reg-btn" class="btn btn-gold" onclick="join()">ΥΠΟΒΟΛΗ</button>
        </div>

        <!-- ΛΙΣΤΑ -->
        <div class="card">
            <h2>📊 ΚΑΤΑΤΑΞΗ</h2>
            <div id="player-list"></div>
        </div>

    </div>
</div>

<script>
    let players = [];
    let master = false;

    function login() {
        if(prompt("Κωδικός:") === "1234") {
            master = true;
            document.getElementById('admin-area').style.display = 'block';
            show();
        }
    }

    function tick() {
        const d = new Date();
        document.getElementById('live-date').innerText = d.toLocaleDateString('el-GR', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
        document.getElementById('main-clock').innerText = d.toLocaleTimeString('el-GR');
        
        const deadline = document.getElementById('m-time').value;
        if(deadline) {
            if(new Date() >= new Date(deadline)) {
                document.getElementById('reg-btn').disabled = true;
                document.getElementById('status-msg').innerHTML = "<span style='color:#ff4444;'>🚫 ΕΓΓΡΑΦΕΣ ΚΛΕΙΣΤΕΣ</span>";
            } else {
                document.getElementById('reg-btn').disabled = false;
