<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tavli Master Control</title>
    <style>
        body {
            margin: 0; font-family: 'Segoe UI', sans-serif;
            background: #2c1a12 url('https://upload.wikimedia.org/wikipedia/commons/3/30/Backgammon_lg.jpg') no-repeat center center fixed;
            background-size: cover; color: white;
        }
        .overlay { background: rgba(0, 0, 0, 0.85); min-height: 100vh; padding: 20px 10px; }
        .container { max-width: 500px; margin: auto; }
        
        /* HEADER /
        .header {
            text-align: center; border: 3px solid #d4af37; padding: 15px;
            border-radius: 20px; background: rgba(40, 20, 10, 0.95); margin-bottom: 20px;
        }
        #clock { font-size: 3rem; font-weight: bold; color: #d4af37; }
        
        .card {
            background: rgba(30, 30, 30, 0.95); padding: 20px;
            border-radius: 15px; margin-bottom: 15px; border-left: 5px solid #d4af37;
        }
        h2 { color: #d4af37; margin-top: 0; font-size: 1.2rem; }

        input {
            width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px;
            border: 1px solid #555; background: #111; color: white; box-sizing: border-box;
        }
        
        .btn {
            width: 100%; padding: 15px; border: none; border-radius: 10px;
            cursor: pointer; font-weight: bold; text-transform: uppercase;
        }
        .btn-gold { background: #d4af37; color: black; }
        .btn-master { background: #444; color: #aaa; font-size: 0.7rem; margin-top: 10px; }
        
        / MASTER ONLY ELEMENTS */
        .master-only { display: none; border: 1px dashed #d4af37; padding: 10px; margin-top: 10px; }
        
        .player-row {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(255,255,255,0.1); padding: 10px; margin: 5px 0; border-radius: 8px;
        }
        .score-badge { background: #d4af37; color: black; padding: 5px 10px; border-radius: 5px; font-weight: bold; }
        
        .admin-controls button { background: #2e7d32; color: white; border: none; padding: 5px; margin-left: 5px; border-radius: 3px; cursor: pointer; }
        .del-btn { background: #cc0000 !important; }
    </style>
</head>
<body>

<div class="overlay">
    <div class="container">
        
        <div class="header">
            <div id="date" style="font-size: 0.9rem;"></div>
            <div id="clock">00:00</div>
            <div style="color:#d4af37; letter-spacing: 2px;">TAVLI TOURNAMENT SYSTEM</div>
            <button class="btn btn-master" onclick="masterLogin()">MASTER LOGIN</button>
        </div>

        <!-- ΡΥΘΜΙΣΕΙΣ (ΜΟΝΟ ΓΙΑ MASTER) -->
        <div id="admin-settings" class="card master-only">
            <h2>⚙️ MASTER PANEL</h2>
            <input type="text" id="m-prz1" placeholder="1ο Έπαθλο" oninput="updateUI()">
            <input type="text" id="m-prz2" placeholder="2ο Έπαθλο" oninput="updateUI()">
            <input type="datetime-local" id="m-deadline">
            <button class="btn btn-gold" style="background:#2e7d32; color:white;" onclick="confirmStart()">✅ ΕΠΙΒΕΒΑΙΩΣΗ ΕΝΑΡΞΗΣ</button>
        </div>

        <!-- ΕΠΑΘΛΑ (ΓΙΑ ΟΛΟΥΣ) -->
        <div class="card">
            <h2>🏆 ΕΠΑΘΛΑ</h2>
            <div id="display-prizes" style="color:#d4af37; font-weight:bold;">
                🥇 <span id="view-p1">-</span><br>
                🥈 <span id="view-p2">-</span>
            </div>
        </div>

        <!-- ΕΓΓΡΑΦΗ (ΓΙΑ ΟΛΟΥΣ) -->
        <div class="card">
            <h2>📝 ΔΗΛΩΣΗ ΣΥΜΜΕΤΟΧΗΣ</h2>
            <div id="reg-status" style="text-align:center; color:#ff4444; font-weight:bold;"></div>
            <input type="text" id="p-name" placeholder="Το όνομά σου...">
            <button id="add-btn" class="btn btn-gold" onclick="addPlayer()">ΥΠΟΒΟΛΗ</button>
        </div>

        <!-- ΚΑΤΑΤΑΞΗ / ΠΑΙΚΤΕΣ -->
        <div class="card">
            <h2>📊 ΚΑΤΑΤΑΞΗ ΠΑΙΚΤΩΝ</h2>
            <div id="player-list"></div>
        </div>

    </div>
</div>

<script>
    let players = [];
    let isMaster = false;

    function masterLogin() {
        let pass = prompt("Δώσε κωδικό Master:");
        if(pass === "1234") {
            isMaster = true;
            document.querySelectorAll('.master-only').forEach(el => el.style.display = 'block');
            render();
            alert("Καλωσόρισες Master!");
        } else {
            alert("Λάθος κωδικός!");
        }
    }

    function update() {
        const now = new Date();
        document.getElementById('date').innerText = now.toLocaleDateString('el-GR', {weekday:'long', day:'numeric', month:'long'});
        document.getElementById('clock').innerText = now.toLocaleTimeString('el-GR', {hour:'2-digit', minute:'2-digit'});
        
        const deadline = document.getElementById('m-deadline').value;
        if(deadline && new Date() >= new Date(deadline)) {
            document.getElementById('add-btn').disabled = true;
            document.getElementById('reg-status').innerText = "🚫 ΟΙ ΕΓΓΡΑΦΕΣ ΕΚΛΕΙΣΑΝ";
        }
    }
    setInterval(update, 1000);

    function addPlayer() {
        const inp = document.getElementById('p-name');
        if(!inp.value.trim()) return;
        players.push({ name: inp.value.trim(), score: 0 });
        inp.value = "";
        render();
    }

    function addScore(index) {
        players[index].score++;
        render();
    }

    function removePlayer(index) {
        if(confirm("Διαγραφή παίκτη;")) {
            players.splice(index, 1);
            render();
        }
    }

    function confirmStart() {
        alert("Ο Master επιβεβαίωσε την έναρξη του τουρνουά!");
    }

    function updateUI() {
        document.getElementById('view-p1').innerText = document.getElementById('m-prz1').value || "-";
        document.getElementById('view-p2').innerText = document.getElementById('m-prz2').value || "-";
    }

    function render() {
        // Ταξινόμηση κατά σκορ
        players.sort((a, b) => b.score - a.score);
        
        const list = document.getElementById('player-list');
        list.innerHTML = players.map((p, i) => `
            <div class="player-row">
                <span><b>${i+1}.</b> ${p.name}</span>
                <div style="display:flex; align-items:center;">
                    <span class="score-badge">${p.score} Νίκες</span>
                    ${isMaster ? `
                        <div class="admin-controls">
                            <button onclick="addScore(${i})">+1</button>
                            <button class="del-btn" onclick="removePlayer(${i})">X</button>
                        </div>
                    ` : ''}
                </div>
            </div>
        `).join('');
    }
</script>

</body>
</html>
