<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tavli Tournament 2026</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            background: #2c1a12 url('https://upload.wikimedia.org/wikipedia/commons/3/30/Backgammon_lg.jpg') no-repeat center center fixed;
            background-size: cover;
            color: white;
        }
        .overlay {
            background: rgba(0, 0, 0, 0.85);
            min-height: 100vh;
            padding: 20px 10px;
        }
        .main-box { max-width: 500px; margin: auto; }
        
        /* ΡΟΛΟΪ & ΗΜΕΡΟΜΗΝΙΑ */
        .top-info {
            text-align: center;
            border: 3px solid #d4af37;
            padding: 20px;
            border-radius: 20px;
            background: rgba(40, 20, 10, 0.9);
            margin-bottom: 20px;
        }
        #clock { font-size: 3.5rem; font-weight: bold; color: #d4af37; margin: 5px 0; }
        #date { font-size: 1.1rem; text-transform: uppercase; }

        .card {
            background: rgba(30, 30, 30, 0.95);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 15px;
            border-top: 5px solid #d4af37;
        }
        h2 { color: #d4af37; text-align: center; margin-top: 0; }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #555;
            background: #111;
            color: white;
            box-sizing: border-box;
        }
        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            text-transform: uppercase;
        }
        .btn-gold { background: #d4af37; color: black; margin-top: 10px; }
        .btn-draw { background: #2e7d32; color: white; margin-top: 20px; }

        .player-row {
            display: flex;
            justify-content: space-between;
            background: rgba(255,255,255,0.1);
            padding: 12px;
            margin: 5px 0;
            border-radius: 8px;
        }
        .del-btn { background: #cc0000; color: white; border: none; border-radius: 5px; padding: 5px 10px; }
        .draw-box { 
            background: #d4af37; color: black; 
            padding: 15px; margin-top: 10px; 
            border-radius: 10px; font-weight: bold; 
            text-align: center;
        }
    </style>
</head>
<body>

<div class="overlay">
    <div class="main-box">
        
        <div class="top-info">
            <div id="date">Φορτώνει ημερομηνία...</div>
            <div id="clock">00:00</div>
            <div style="color:#d4af37; font-weight:bold;">TAVLI MASTER 2026</div>
        </div>

        <div class="card">
            <h2>🏆 ΕΠΑΘΛΑ & ΧΡΟΝΟΣ</h2>
            <input type="text" id="prz1" placeholder="🥇 1ο Έπαθλο">
            <input type="text" id="prz2" placeholder="🥈 2ο Έπαθλο">
            <input type="text" id="prz3" placeholder="🥉 3ο Έπαθλο">
            <label style="font-size: 0.9rem;">Λήξη εγγραφών (Ημερομηνία/Ώρα):</label>
            <input type="datetime-local" id="end-time">
        </div>

        <div class="card">
            <h2>📝 ΕΓΓΡΑΦΗ</h2>
            <div id="status" style="text-align:center; color:red; font-weight:bold; margin-bottom:10px;"></div>
            <input type="text" id="p-name" placeholder="Όνομα παίκτη...">
            <button id="add-btn" class="btn btn-gold" onclick="add()">ΥΠΟΒΟΛΗ</button>
        </div>

        <div class="card">
            <h2>👥 ΠΑΙΚΤΕΣ (<span id="total">0</span>)</h2>
            <div id="p-list"></div>
            <button class="btn btn-draw" onclick="draw()">🔥 ΚΛΗΡΩΣΗ ΖΕΥΓΑΡΙΩΝ</button>
            <div id="draw-res"></div>
        </div>

    </div>
</div>

<script>
    let players = [];

    function update() {
        const now = new Date();
        document.getElementById('date').innerText = now.toLocaleDateString('el-GR', {weekday:'long', day:'numeric', month:'long'});
        document.getElementById('clock').innerText = now.toLocaleTimeString('el-GR', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
        
        const deadline = document.getElementById('end-time').value;
        if(deadline && new Date() >= new Date(deadline)) {
            document.getElementById('add-btn').disabled = true;
            document.getElementById('status').innerText = "🚫 ΟΙ ΕΓΓΡΑΦΕΣ ΕΚΛΕΙΣΑΝ";
        } else {
            document.getElementById('add-btn').disabled = false;
            document.getElementById('status').innerText = "";
        }
    }
    setInterval(update, 1000);

    function add() {
        const inp = document.getElementById('p-name');
        if(inp.value.trim()) {
            players.push(inp.value.trim());
            inp.value = "";
            render();
        }
    }

    function remove(i) {
        if(confirm("Διαγραφή παίκτη;")) {
            players.splice(i, 1);
            render();
        }
    }

    function render() {
        document.getElementById('total').innerText = players.length;
        const div = document.getElementById('p-list');
        div.innerHTML = players.map((p, i) => `
            <div class="player-row">
                <span>${i+1}. ${p}</span>
                <button class="del-btn" onclick="remove(${i})">X</button>
            </div>
        `).join('');
    }

    function draw() {
        if(players.length < 2) return alert("Βάλε τουλάχιστον 2 παίκτες!");
        let s = [...players].sort(() => Math.random() - 0.5);
        let res = "<h3>ΖΕΥΓΑΡΙΑ:</h3>";
        for(let i=0; i<s.length; i+=2) {
            res += `<div class="draw-box">${s[i]} VS ${s[i+1] || '---'}</div>`;
        }
        document.getElementById('draw-res').innerHTML = res;
    }
</script>

</body>
</html>
