<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tavli Elite Tournament</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: url('https://img.freepik.com/free-photo/top-view-backgammon-board-with-checkers-dice_23-2148283311.jpg?t=st=1715694532~exp=1715698132~hmac=56d0d297a7d4a25925a17623910c660f666f6c6d6d6d6d6d6d6d6d6d') no-repeat center center fixed;
            background-size: cover;
            color: white;
        }

        .overlay {
            background: rgba(0, 0, 0, 0.85);
            min-height: 100vh;
            padding: 20px;
        }

        .container { max-width: 600px; margin: auto; }

        .header {
            text-align: center;
            border: 3px solid #d4af37;
            padding: 20px;
            border-radius: 20px;
            background: rgba(62, 39, 35, 0.9);
            margin-bottom: 20px;
        }

        .card {
            background: rgba(45, 45, 45, 0.9);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            border-left: 5px solid #d4af37;
        }

        h2 { color: #d4af37; margin-top: 0; font-size: 1.2rem; }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            border: none;
            box-sizing: border-box;
            font-size: 16px;
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
            transition: 0.3s;
        }

        .btn-gold { background: #d4af37; color: black; }
        .btn-red { background: #c62828; color: white; margin-top: 5px; padding: 5px; font-size: 12px; width: auto; }
        .btn-start { background: #2e7d32; color: white; font-size: 1.2rem; }

        .player-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.1);
            padding: 10px;
            margin: 5px 0;
            border-radius: 8px;
        }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        
        #timer { font-size: 2rem; color: #ff5252; font-weight: bold; }
        
        .prize-tag { color: #d4af37; font-weight: bold; }
    </style>
</head>
<body>

<div class="overlay">
    <div class="container">
        
        <div class="header">
            <h1>🎲 TAVLI PRO ELITE</h1>
            <div id="startTimeDisplay">Ορισμός έναρξης...</div>
            <div id="timer">00:00:00</div>
        </div>

        <!-- Ρυθμίσεις Διοργανωτή -->
        <div class="card">
            <h2>⚙️ ΡΥΘΜΙΣΕΙΣ ΤΟΥΡΝΟΥΑ</h2>
            <div class="stats-grid">
                <input type="number" id="maxPlayers" placeholder="Μέγιστοι Παίκτες (π.χ. 16)">
                <input type="time" id="gameTime">
            </div>
            <input type="text" id="prize1" placeholder="Έπαθλο 1ου Νικητή">
            <input type="text" id="prize2" placeholder="Έπαθλο 2ου Νικητή">
            <input type="text" id="prize3" placeholder="Έπαθλο 3ου Νικητή">
            <button class="btn btn-gold" onclick="saveSettings()">ΚΛΕΙΔΩΜΑ ΡΥΘΜΙΣΕΩΝ</button>
        </div>

        <!-- Συμμετοχή -->
        <div class="card">
            <h2>📝 ΔΗΛΩΣΗ ΣΥΜΜΕΤΟΧΗΣ</h2>
            <div id="limitMsg"></div>
            <input type="text" id="pName" placeholder="Το όνομά σου...">
            <button id="regBtn" class="btn btn-gold" onclick="register()">ΔΗΛΩΣΗ ΤΩΡΑ</button>
        </div>

        <!-- Λίστα & Ζευγάρια -->
        <div class="card">
            <h2>👥 ΛΙΣΤΑ ΠΑΙΚΤΩΝ (<span id="count">0</span>)</h2>
            <div id="playerList"></div>
            <button class="btn btn-start" onclick="startTournament()">🔥 ΕΝΑΡΞΗ ΚΛΗΡΩΣΗΣ</button>
            <div id="matchBoard"></div>
        </div>

        <!-- Έπαθλα -->
        <div class="card">
            <h2>🏆 ΕΠΑΘΛΑ</h2>
            <p>🥇 1ος: <span id="p1" class="prize-tag">-</span></p>
            <p>🥈 2ος: <span id="p2" class="prize-tag">-</span></p>
            <p>🥉 3ος: <span id="p3" class="prize-tag">-</span></p>
        </div>

    </div>
</div>

<script>
    let players = [];
    let maxCap = 100;

    function saveSettings() {
        maxCap = document.getElementById('maxPlayers').value || 100;
        document.getElementById('p1').innerText = document.getElementById('prize1').value || "-";
        document.getElementById('p2').innerText = document.getElementById('prize2').value || "-";
        document.getElementById('p3').innerText = document.getElementById('prize3').value || "-";
        const timeVal = document.getElementById('gameTime').value;
        if(timeVal) document.getElementById('startTimeDisplay').innerText = "Έναρξη στις: " + timeVal;
        alert("Οι ρυθμίσεις αποθηκεύτηκαν!");
    }

    function register() {
        const name = document.getElementById('pName').value.trim();
        if(!name) return;
        
        if(players.length >= maxCap) {
            alert("Το τουρνουά είναι γεμάτο!");
            return;
        }

        players.push(name);
        document.getElementById('pName').value = "";
        updateUI();
    }

    function removePlayer(index) {
        if(confirm("Θέλεις σίγουρα να διαγράψεις τον παίκτη " + players[index] + ";")) {
            players.splice(index, 1);
            updateUI();
        }
    }

    function updateUI() {
        document.getElementById('count').innerText = players.length;
        const list = document.getElementById('playerList');
        list.innerHTML = players.map((p, i) => `
            <div class="player-item">
                <span>${i+1}. ${p}</span>
                <button class="btn btn-red" onclick="removePlayer(${i})">Διαγραφή</button>
            </div>
        `).join('');

        if(players.length >= maxCap) {
            document.getElementById('regBtn').disabled = true;
            document.getElementById('limitMsg').innerText = "🚫 ΟΙ ΣΥΜΜΕΤΟΧΕΣ ΕΚΛΕΙΣΑΝ";
        }
    }

    function startTournament() {
        if(players.length < 2) return alert("Χρειάζονται παίκτες!");
        let shuffled = [...players].sort(() => Math.random() - 0.5);
        let html = "<h3>🎲 ΖΕΥΓΑΡΙΑ ΠΡΩΤΟΥ ΓΥΡΟΥ</h3>";
        for(let i=0; i<shuffled.length; i+=2) {
            html += `<div style="background:#d4af37; color:black; padding:10px; margin:5px; border-radius:5px; font-weight:bold;">
                ${shuffled[i]} VS ${shuffled[i+1] || '--- (BYE)'}
            </div>`;
        }
        document.getElementById('matchBoard').innerHTML = html;
    }

    // Αντίστροφη Μέτρηση (Απλή απεικόνιση)
    setInterval(() => {
        const d = new Date();
