<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tavli Tournament Master 2026</title>
<style>
body {
margin: 0;
font-family: 'Segoe UI', Arial, sans-serif;
background-color: #1a0f0a;
background-image: url("https://upload.wikimedia.org/wikipedia/commons/3/30/Backgammon_lg.jpg");
background-repeat: no-repeat;
background-position: center;
background-attachment: fixed;
background-size: cover;
color: #ffffff;
}
.overlay { background: rgba(0, 0, 0, 0.88); min-height: 100vh; padding: 20px; }
.container { max-width: 550px; margin: 0 auto; }

.header-box {
text-align: center; border: 3px solid #d4af37; padding: 20px;
border-radius: 25px; background: rgba(30, 15, 10, 0.95); margin-bottom: 25px;
}
#main-clock { font-size: 3.5rem; font-weight: 900; color: #d4af37; margin: 10px 0; }

.card {
background: rgba(25, 25, 25, 0.95); padding: 25px;
border-radius: 20px; margin-bottom: 20px; border-left: 6px solid #d4af37;
}
h2 { color: #d4af37; margin-top: 0; font-size: 1.3rem; text-transform: uppercase; border-bottom: 1px solid #444; padding-bottom: 10px; }

input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #444; background: #000; color: #fff; box-sizing: border-box; }

.btn { width: 100%; padding: 16px; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; text-transform: uppercase; margin: 5px 0; transition: 0.3s; }
.btn-gold { background: linear-gradient(to bottom, #d4af37, #b8952e); color: #000; }
.btn-draw { background: #2e7d32; color: white; font-size: 1.1rem; }
.btn-master-save { background: #d4af37; color: black; margin-top: 10px; }

.master-panel { display: none; background: rgba(212, 175, 55, 0.1); border: 2px dashed #d4af37; padding: 20px; border-radius: 15px; margin-bottom: 20px; }

.prize-display { font-size: 1.4rem; font-weight: bold; margin: 8px 0; }
.prize-display span { color: #d4af37; }

.player-row {
display: flex; justify-content: space-between; align-items: center;
background: rgba(255, 255, 255, 0.05); padding: 12px; margin: 8px 0; border-radius: 12px;
}
.score-pill { background: #d4af37; color: #000; padding: 4px 10px; border-radius: 6px; font-weight: bold; }

.admin-controls button { background: #27ae60; color: white; border: none; padding: 6px 10px; margin-left: 5px; border-radius: 5px; cursor: pointer; }
.btn-delete { background: #e74c3c !important; }

.draw-result-box { background: rgba(212, 175, 55, 0.15); padding: 15px; border-radius: 10px; margin-top: 10px; border: 1px solid #d4af37; text-align: center; font-size: 1.2rem; font-weight: bold; }
.master-btn-small { background: none; border: none; color: #555; font-size: 0.7rem; cursor: pointer; text-decoration: underline; }
</style>
</head>
<body>

<div class="overlay">
<div class="container">

<div class="header-box">
<div id="live-date" style="font-size: 0.9rem; opacity: 0.8;"></div>
<div id="main-clock">00:00:00</div>
<div style="font-weight: bold; letter-spacing: 2px;">TAVLI TOURNAMENT 2026</div>
<button class="master-btn-small" onclick="login()">MASTER ACCESS</button>
</div>

<!-- MASTER PANEL -->
<div id="admin-area" class="master-panel">
<h2>⚙️ ΡΥΘΜΙΣΕΙΣ MASTER</h2>
<input type="text" id="m-p1" placeholder="Έπαθλο 1ου">
<input type="text" id="m-p2" placeholder="Έπαθλο 2ου">
<input type="text" id="m-p3" placeholder="Έπαθλο 3ου">
<label>Λήξη Εγγραφών:</label>
<input type="datetime-local" id="m-time">
<button class="btn btn-master-save" onclick="saveMasterSettings()">💾 ΕΠΙΚΥΡΩΣΗ ΡΥΘΜΙΣΕΩΝ</button>
</div>

<!-- ΕΠΑΘΛΑ -->
<div class="card">
<h2>🏆 ΕΠΑΘΛΑ</h2>
<div class="prize-display">🥇 1ος: <span id="view-p1">--</span></div>
<div class="prize-display">🥈 2ος: <span id="view-p2">--</span></div>
<div class="prize-display">🥉 3ος: <span id="view-p3">--</span></div>
</div>

<!-- ΕΓΓΡΑΦΗ -->
<div class="card">
<h2>📝 ΔΗΛΩΣΗ ΣΥΜΜΕΤΟΧΗΣ</h2>
<div id="status-msg" style="text-align:center; font-weight:bold; margin-bottom:10px;"></div>
<input type="text" id="name-input" placeholder="Όνομα παίκτη...">
<button id="reg-btn" class="btn btn-gold" onclick="join()">ΥΠΟΒΟΛΗ</button>
</div>

<!-- ΚΛΗΡΩΣΗ -->
<div class="card">
<h2>🎲 ΚΛΗΡΩΣΗ ΖΕΥΓΑΡΙΩΝ</h2>
<button class="btn btn-draw" onclick="shufflePairs()">🔥 ΚΛΗΡΩΣΗ ΤΩΡΑ</button>
<div id="draw-results"></div>
</div>

<!-- ΚΑΤΑΤΑΞΗ -->
<div class="card">
<h2>📊 ΚΑΤΑΤΑΞΗ & ΝΙΚΕΣ</h2>
<div id="player-list"></div>
</div>

</div>
</div>

<script>
let players = [];
let isMaster = false;

function login() {
if(prompt("Κωδικός Master:") === "1234") {
isMaster = true;
document.getElementById('admin-area').style.display = 'block';
render();
}
}

function tick() {
const d = new Date();
document.getElementById('live-date').innerText = d.toLocaleDateString('el-GR', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
document.getElementById('main-clock').innerText = d.toLocaleTimeString('el-GR');

const deadline = document.getElementById('m-time').value;
if(deadline) {
if(new Date() >= new Date(deadline)) {
document.getElementById('reg-btn').disabled = true;
document.getElementById('status-msg').innerHTML = "<span style='color:#ff4444;'>🚫 ΟΙ ΕΓΓΡΑΦΕΣ ΕΚΛΕΙΣΑΝ</span>";
} else {
document.getElementById('reg-btn').disabled = false;
document.getElementById('status-msg').innerHTML = "<span style='color:#2ecc71;'>✅ ΕΓΓΡΑΦΕΣ ΑΝΟΙΧΤΕΣ</span>";
}
}
}
setInterval(tick, 1000);

function saveMasterSettings() {
document.getElementById('view-p1').innerText = document.getElementById('m-p1').value || "--";
document.getElementById('view-p2').innerText = document.getElementById('m-p2').value || "--";
document.getElementById('view-p3').innerText = document.getElementById('m-p3').value || "--";
alert("Οι ρυθμίσεις επικυρώθηκαν με επιτυχία!");
}

function join() {
const val = document.getElementById('name-input').value.trim();
if(!val) return;
players.push({ n: val, w: 0 });
document.getElementById('name-input').value = "";
render();
}

function shufflePairs() {
if(players.length < 2) return alert("Χρειάζονται τουλάχιστον 2 παίκτες για κλήρωση!");
let shuffled = [...players].sort(() => Math.random() - 0.5);
let html = "<h3>ΤΑ ΖΕΥΓΑΡΙΑ:</h3>";
for(let i=0; i<shuffled.length; i+=2) {
let p1 = shuffled[i].n;
let p2 = shuffled[i+1] ? shuffled[i+1].n : "--- (ΡΕΠΟ) ---";
html += `<div class="draw-result-box">${p1} <span style="color:#d4af37">VS</span> ${p2}</div>`;
}
document.getElementById('draw-results').innerHTML = html;
}

function addWin(i) {
players[i].w++;
render();
}

function del(i) {
if(confirm("Διαγραφή παίκτη;")) {
players.splice(i, 1);
render();
}
}

function render() {
players.sort((a, b) => b.w - a.w);
const list = document.getElementById('player-list');
if(players.length === 0) {
list.innerHTML = "<p style='text-align:center; opacity:0.5;'>Δεν υπάρχουν συμμετοχές.</p>";
return;
}
list.innerHTML = players.map((p, i) => `
<div class="player-row">
<span><b style="color:#d4af37;">#${i+1}</b> ${p.n}</span>
<div style="display:flex; align-items:center;">
<span class="score-pill">${p.w} ΝΙΚΕΣ</span>
${isMaster ? `
<div class="admin-controls">
<button onclick="addWin(${i})">+1</button>
<button class="btn-delete" onclick="del(${i})">X</button>
</div>
` : ''}
</div>
</div>
`).join('');
}
</script>

</body>
</html>
