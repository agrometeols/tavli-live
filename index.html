<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tavli Master Pro</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background-color: #2c1a12;
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/3/30/Backgammon_lg.jpg');
            background-repeat: no-repeat;
            background-position: center;
            background-attachment: fixed;
            background-size: cover;
            color: white;
        }
        .overlay { background: rgba(0, 0, 0, 0.85); min-height: 100vh; padding: 20px 10px; }
        .container { max-width: 500px; margin: auto; }
        
        .header {
            text-align: center; border: 3px solid #d4af37; padding: 15px;
            border-radius: 20px; background: rgba(40, 20, 10, 0.95); margin-bottom: 20px;
        }
        #clock { font-size: 3rem; font-weight: bold; color: #d4af37; text-shadow: 2px 2px 5px black; }
        
        .card {
            background: rgba(30, 30, 30, 0.95); padding: 20px;
            border-radius: 15px; margin-bottom: 15px; border-left: 5px solid #d4af37;
        }
        h2 { color: #d4af37; margin-top: 0; font-size: 1.2rem; text-transform: uppercase; }

        input {
            width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px;
            border: 1px solid #555; background: #111; color: white; box-sizing: border-box;
        }
        
        .btn {
            width: 100%; padding: 15px; border: none; border-radius: 10px;
            cursor: pointer; font-weight: bold; text-transform: uppercase;
        }
        .btn-gold { background: #d4af37; color: black; }
        .btn-master-login { background: transparent; color: #d4af37; border: 1px solid #d4af37; padding: 5px 10px; font-size: 0.7rem; cursor: pointer; margin-top: 10px; border-radius: 5px; }
        
        .master-only { display: none; background: rgba(212, 175, 55, 0.1); border: 1px dashed #d4af37; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
        
        .prize-tag { font-size: 1.5rem; font-weight: bold; display: block; margin: 5px 0; }
        .prize-tag span { color: #d4af37; }

        .player-row {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(255,255,255,0.08); padding: 12px; margin: 6px 0; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1);
        }
        .score-box { background: #d4af37; color: black; padding: 4px 10px; border-radius: 6px; font-weight: bold; margin-right: 8px; }
        
        .admin-btns button { background: #2e7d32; color: white; border: none; padding: 6px 10px; margin-left: 4px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-del { background: #c62828 !important; }
    </style>
</head>
<body>

<div class="overlay">
    <div class="container">
        
        <!-- HEADER -->
        <div class="header">
            <div id="live-date" style="font-size: 0.9rem; opacity: 0.8;"></div>
            <div id="clock">00:00:00</div>
            <div style="font-weight: bold; letter-spacing: 1px;">TOURNAMENT MASTER CONTROL</div>
            <button class="btn-master-login" onclick="doLogin()">MASTER LOGIN</button>
        </div>

        <!-- MASTER SETTINGS -->
        <div id="master-panel" class="master-only">
            <h2>⚙️ ΔΙΑΧΕΙΡΙΣΗ MASTER</h2>
            <label>Έπαθλο 1ου:</label>
            <input type="text" id="inp-p1" placeholder="π.χ. 100€" oninput="syncPrizes()">
            <label>Έπαθλο 2ου:</label>
            <input type="text" id="inp-p2" placeholder="π.χ. 50€" oninput="syncPrizes()">
            <label>Λήξη Εγγραφών:</label>
            <input type="datetime-local" id="inp-deadline">
            <p style="font-size:0.8rem; color:#d4af37;">* Οι αλλαγές φαίνονται ζωντανά κάτω.</p>
        </div>

        <!-- PRIZES -->
        <div class="card">
            <h2>🏆 ΕΠΑΘΛΑ</h2>
            <div class="prize-tag">🥇 1ος: <span id="txt-p1">100€</span></div>
            <div class="prize-tag">🥈 2ος: <span id="txt-p2">50€</span></div>
        </div>

        <!-- REGISTRATION -->
        <div class="card">
            <h2>📝 ΔΗΛΩΣΗ ΣΥΜΜΕΤΟΧΗΣ</h2>
            <div id="timer-msg" style="text-align:center; margin-bottom:10px; font-weight:bold;"></div>
            <input type="text" id="player-input" placeholder="Βάλε το όνομά σου...">
            <button id="reg-btn" class="btn btn-gold" onclick="register()">ΚΑΤΑΧΩΡΗΣΗ</button>
        </div>

        <!-- LEADERBOARD -->
        <div class="card">
            <h2>📊 ΚΑΤΑΤΑΞΗ ΠΑΙΚΤΩΝ</h2>
            <div id="list-container"></div>
        </div>

    </div>
</div>

<script>
    let participants = [];
    let isMasterActive = false;

    function doLogin() {
        let p = prompt("Κωδικός Master:");
        if(p === "1234") {
            isMasterActive = true;
            document.getElementById('master-panel').style.display = 'block';
            refreshList();
            alert("Επιτυχής σύνδεση Master!");
        } else {
            alert("Λάθος κωδικός.");
        }
    }

    function updateTime() {
        const now = new Date();
        document.getElementById('live-date').innerText = now.toLocaleDateString('el-GR', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
        document.getElementById('clock').innerText = now.toLocaleTimeString('el-GR');
        
        const dead = document.getElementById('inp-deadline').value;
        if(dead) {
            const limit = new Date(dead);
            if(now >= limit) {
                document.getElementById('reg-btn').disabled = true;
                document.getElementById('timer-msg').innerHTML = "<span style='color:#ff4444;'>🚫 ΟΙ ΕΓΓΡΑΦΕΣ ΕΚΛΕΙΣΑΝ</span>";
            } else {
                document.getElementById('reg-btn').disabled = false;
                document.getElementById('timer-msg').innerHTML = "<span style='color:#4caf50;'>✅ ΕΓΓΡΑΦΕΣ ΑΝΟΙΧΤΕΣ</span>";
            }
        }
    }
    setInterval(updateTime, 1000);

    function register() {
        const name = document.getElementById('player-input').value.trim();
        if(!name) return;
        participants.push({ name: name, wins: 0 });
        document.getElementById('player-input').value = "";
        refreshList();
    }

    function addWin(idx) {
        participants[idx].wins++;
        refreshList();
    }

    function deletePlayer(idx) {
        if(confirm("Διαγραφή παίκτη;")) {
            participants.splice(idx, 1);
            refreshList();
        }
    }

    function syncPrizes() {
        const p1 = document.getElementById('inp-p1').value;
        const p2 = document.getElementById('inp-p2').value;
        if(p1) document.getElementById('txt-p1').innerText = p1;
        if(p2) document.getElementById('txt-p2').innerText = p2;
    }

    function refresh
