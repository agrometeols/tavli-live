<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tavli Elite Tournament 2026</title>
    <style>
        :root {
            --gold: #d4af37;
            --dark-wood: #2c1a12;
            --glass: rgba(0, 0, 0, 0.85);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            /* Χρήση σταθερής εικόνας από Wikipedia και fallback χρώμα wood /
            background: #4d2d1e url('https://upload.wikimedia.org/wikipedia/commons/thumb/3/30/Backgammon_lg.jpg/1280px-Backgammon_lg.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #f0d9b5;
        }

        .overlay {
            background: linear-gradient(to bottom, rgba(0,0,0,0.7), rgba(0,0,0,0.9));
            min-height: 100vh;
            padding: 20px 10px;
        }

        .container { max-width: 550px; margin: auto; }

        / HEADER & CLOCKS /
        .header {
            text-align: center;
            border: 4px double var(--gold);
            padding: 25px 15px;
            border-radius: 30px;
            background: var(--glass);
            margin-bottom: 25px;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        #live-date { 
            font-size: 1.2rem; 
            text-transform: uppercase; 
            letter-spacing: 2px;
            color: white;
            margin-bottom: 5px;
        }

        #live-clock { 
            font-size: 3rem; 
            font-weight: 900; 
            color: var(--gold);
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.6);
            margin: 10px 0;
        }

        / CARDS /
        .card {
            background: var(--glass);
            padding: 25px;
            border-radius: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(212, 175, 55, 0.2);
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
        }

        h2 { 
            color: var(--gold); 
            text-align: center; 
            border-bottom: 2px solid var(--gold); 
            padding-bottom: 10px;
            margin-top: 0;
            font-size: 1.4rem;
        }

        input, select {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
            border: 1px solid #554;
            background: #111;
            color: white;
            box-sizing: border-box;
            font-size: 16px;
        }

        / BUTTONS /
        .btn {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 900;
            font-size: 1.1rem;
            text-transform: uppercase;
            transition: all 0.3s;
        }

        .btn-gold { 
            background: linear-gradient(45deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            color: #1a1a1a; 
            box-shadow: 0 4px 15px rgba(191, 149, 63, 0.4);
        }

        .btn-gold:active { transform: scale(0.98); }
        .btn-gold:disabled { opacity: 0.4; cursor: not-allowed; filter: grayscale(1); }

        / LIST & PLAYERS */
        .player-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.07);
            padding: 15px;
            margin: 8px 0;
            border-radius: 12px;
            border-left: 5px solid var(--gold);
        }

        .del-btn { 
            background: #ff3333; 
            color: white; 
            border: none; 
            width: 35px; 
            height: 35px; 
            border-radius: 50%; 
            cursor: pointer;
            font-weight: bold;
        }

        .prizes {
            font-size: 1.1rem;
            line-height: 1.8;
        }

        .deadline-timer {
            color: #ff4444;
            font-weight: bold;
            text-align: center;
            font-size: 1.1rem;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="overlay">
    <div class="container">
        
        <!-- ΜΕΓΑΛΟ ΡΟΛΟΪ -->
        <div class="header">
            <div id="live-date">---</div>
            <div id="live-clock">00:00:00</div>
            <h1 style="margin:0; font-size: 1.4rem; color: #fff;">TOURNAMENT CONTROLLER</h1>
        </div>

        <!-- ΕΠΑΘΛΑ & ΡΥΘΜΙΣΕΙΣ -->
        <div class="card">
            <h2>🏆 ΕΠΑΘΛΑ & ΧΡΟΝΟΣ</h2>
            <div class="prizes">
                🥇 1ος: <input type="text" id="p1" placeholder="Έπαθλο 1ου..." oninput="updatePrizes()">
                🥈 2ος: <input type="text" id="p2" placeholder="Έπαθλο 2ου..." oninput="updatePrizes()">
                🥉 3ος: <input type="text" id="p3" placeholder="Έπαθλο 3ου..." oninput="updatePrizes()">
            </div>
            <label style="display:block; margin-top:15px; color:var(--gold);">Λήξη Εγγραφών:</label>
            <input type="datetime-local" id="deadline">
            <div id="status-msg" class="deadline-timer"></div>
        </div>

        <!-- ΕΓΓΡΑΦΗ -->
        <div class="card">
            <h2>📝 ΕΓΓΡΑΦΗ ΠΑΙΚΤΗ</h2>
            <input type="text" id="playerName" placeholder="Όνομα παίκτη...">
            <button id="reg-btn" class="btn btn-gold" onclick="addPlayer()">ΥΠΟΒΟΛΗ ΣΥΜΜΕΤΟΧΗΣ</button>
        </div>

        <!-- ΣΥΜΜΕΤΕΧΟΝΤΕΣ -->
        <div class="card">
            <h2>👥 ΠΑΙΚΤΕΣ (<span id="total">0</span>)</h2>
            <div id="playerList"></div>
            
            <button class="btn" style="background:#2e7d32; color:white; margin-top:20px;" onclick="generateDraw()">
                🔥 ΚΛΗΡΩΣΗ ΖΕΥΓΑΡΙΩΝ
            </button>
            <div id="drawResults"></div>
        </div>

    </div>
</div>

<script>
    let players = [];
    let isClosed = false;

    // ΕΝΗΜΕΡΩΣΗ ΩΡΑΣ & ΗΜΕΡΟΜΗΝΙΑΣ
    function tick() {
        const now = new Date();
        const dateOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('live-date').innerText = now.toLocaleDateString('el-GR', dateOptions);
        document.getElementById('live-clock').innerText = now.toLocaleTimeString('el-GR');
        
        checkTime();
    }
    setInterval(tick, 1000);

        const deadlineInput = document.getElementById('deadline').value;
        if(!deadlineInput) return;

        const limit = new Date(deadlineInput);

        } else {
